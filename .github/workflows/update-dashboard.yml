name: Update profile dashboard

on:
  schedule:
    # GitHub cron is UTC; every 15 minutes keeps the profile current without
    # depending on the timezone of the runner.
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_dashboard.py"
      - ".github/workflows/update-dashboard.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate dashboard in Beijing time
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_dashboard.py --username NextCandy --output assets --check-readme README.md

      - name: Commit changed dashboard assets
        shell: bash
        run: |
          if git diff --quiet -- assets/dashboard-light.svg assets/dashboard-dark.svg; then
            echo "Dashboard is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard-light.svg assets/dashboard-dark.svg
          git commit -m "Refresh live profile dashboard"
          git push
