name: Update profile dashboard

on:
  schedule:
    # GitHub Actions shortest allowed interval (every 5 minutes) to keep Beijing time current.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-dashboard]
  push:
    branches: [main]
    paths:
      - "scripts/update_dashboard.py"
      - ".github/workflows/update-dashboard.yml"
      - "assets/hero-light.svg"
      - "assets/hero-dark.svg"
      - "assets/closed-loop-light.svg"
      - "assets/closed-loop-dark.svg"

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate dashboard in Beijing time
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_dashboard.py --username NextCandy --output assets --check-readme README.md

      - name: Commit changed dashboard assets with cache-busting URLs
        shell: bash
        run: |
          if git diff --quiet -- assets/dashboard-light.svg assets/dashboard-dark.svg; then
            echo "Dashboard is already current (no new commits or date change)."
            exit 0
          fi

          python - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          for filename in (
              "hero-light.svg",
              "hero-dark.svg",
              "dashboard-light.svg",
              "dashboard-dark.svg",
              "closed-loop-light.svg",
              "closed-loop-dark.svg",
          ):
              asset_path = Path("assets") / filename
              if not asset_path.exists():
                  continue
              version = hashlib.sha256(asset_path.read_bytes()).hexdigest()[:12]
              pattern = rf"assets/{re.escape(filename)}(?:\?v=[^\" )]+)?"
              replacement = f"assets/{filename}?v={version}"
              readme, matches = re.subn(pattern, replacement, readme)
              if matches == 0 and filename.startswith("dashboard-"):
                  raise SystemExit(f"README does not reference {filename}")
          readme_path.write_text(readme, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/dashboard-light.svg assets/dashboard-dark.svg
          git commit -m "Refresh live profile dashboard"
          git push
