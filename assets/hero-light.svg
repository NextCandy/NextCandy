<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="NextCandy profile console" data-mode="light">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0099C4"/><stop offset=".5" stop-color="#6A54D8"/><stop offset="1" stop-color="#E83E8C"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".12" stop-color="#FFFFFF"/><stop offset=".88" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="418"/></clipPath>
    <clipPath id="tickclip"><rect x="0" y="376" width="1200" height="44"/></clipPath>
  </defs>
  <style>
    text{font-family:"SFMono-Regular","SF Mono",Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    .micro{font-size:10px;letter-spacing:2.4px;font-weight:700}.label{font-size:12px;letter-spacing:3.5px;font-weight:700}
    .big{font-size:66px;font-weight:900;letter-spacing:-2px}.tick{font-size:11px;letter-spacing:3px;font-weight:700}
    .term{font-size:12.5px;font-weight:600}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-in-out infinite}
    .blink{animation:blink 1.1s steps(1) infinite}
    .o1{transform-box:fill-box;transform-origin:center;animation:spin 34s linear infinite}
    .o2{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite reverse}
    .o3{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
    .mq{animation:mq 26s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3;transform:scale(.6)}}
    @keyframes blink{50%{opacity:0}}@keyframes mq{to{transform:translateX(-903px)}}
    @media(prefers-reduced-motion:reduce){.pulse,.blink,.o1,.o2,.o3,.mq{animation:none}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#FFFFFF"/>
    <path d="M0 1.5H1200" stroke="#B8C3D1" stroke-width="3"/>

    <!-- window chrome -->
    <g transform="translate(24 24)">
      <text x="64" y="4" class="micro" fill="#5B7885">NEXTCANDY / PROFILE_CONSOLE · V2</text>
    </g>
    <g transform="translate(950 24)">
      <circle class="pulse" r="4.5" fill="#12995F" filter="url(#glow)"/>
      <text x="16" y="4" class="micro" fill="#12995F">ALL SYSTEMS OPERATIONAL</text>
    </g>
    <path d="M24 52H1176" stroke="#B9D2DC"/>

    <!-- headline -->
    <text x="40" y="112" class="label" fill="#0099C4">// DOMAIN CONNOISSEUR — EST. 2016</text>
    <text x="38" y="184" class="big" fill="#0C2733">COLLECT DOMAINS.</text>
    <text x="38" y="252" class="big" fill="url(#accent)">BUILD TOOLS.</text>

    <!-- terminal card -->
    <g transform="translate(38 282)">
      <rect width="600" height="82" rx="12" fill="#0E2233" stroke="#B9D2DC"/>
      <rect width="600" height="82" rx="12" fill="#0099C4" opacity=".03"/>
      <circle cx="16" cy="16" r="3" fill="#FF5F57"/><circle cx="28" cy="16" r="3" fill="#FEBC2E"/><circle cx="40" cy="16" r="3" fill="#28C840"/>
      <text x="560" y="20" text-anchor="end" class="micro" fill="#5B7885">zsh — 80×24</text>
      <text x="18" y="44" class="term" fill="#12995F">$ whoami</text>
      <text x="96" y="44" class="term" fill="#D8E9F2">nextcandy :: domain collector · whois toolmaker</text>
      <text x="18" y="66" class="term" fill="#12995F">$ status</text>
      <text x="96" y="66" class="term" fill="#D8E9F2">16 public repos · 5 languages · 862 domains</text>
      <text x="476" y="66" class="term" fill="#12995F">ONLINE</text>
      <rect class="blink" x="536" y="55" width="9" height="15" fill="#0099C4"/>
    </g>

    <!-- orbit core -->
    <g transform="translate(975 195)">
      <circle r="158" fill="none" stroke="#B9D2DC" stroke-dasharray="2 7"/>
      <circle r="112" fill="none" stroke="#B9D2DC" stroke-dasharray="2 7"/>
      <circle r="68" fill="none" stroke="#B9D2DC" stroke-dasharray="2 7"/>
      <g class="o1">
        <circle cx="158" r="7" fill="#FFFFFF" stroke="#0099C4" stroke-width="2"/><circle class="pulse" cx="158" r="2.5" fill="#0099C4"/>
        <circle cx="-79" cy="137" r="7" fill="#FFFFFF" stroke="#E83E8C" stroke-width="2"/><circle class="pulse" cx="-79" cy="137" r="2.5" fill="#E83E8C"/>
        <circle cx="-79" cy="-137" r="7" fill="#FFFFFF" stroke="#6A54D8" stroke-width="2"/><circle class="pulse" cx="-79" cy="-137" r="2.5" fill="#6A54D8"/>
      </g>
      <g class="o2">
        <circle cy="-112" r="6" fill="#FFFFFF" stroke="#0099C4" stroke-width="2"/>
        <circle cx="97" cy="56" r="6" fill="#FFFFFF" stroke="#E83E8C" stroke-width="2"/>
        <circle cx="-97" cy="56" r="6" fill="#FFFFFF" stroke="#6A54D8" stroke-width="2"/>
      </g>
      <g class="o3">
        <circle cx="68" r="5" fill="#FFFFFF" stroke="#12995F" stroke-width="2"/>
        <circle cx="-68" r="5" fill="#FFFFFF" stroke="#B57400" stroke-width="2"/>
      </g>
      <circle r="42" fill="#FFFFFF" stroke="url(#accent)" stroke-width="2"/>
      <circle class="pulse" r="52" fill="none" stroke="#0099C4" stroke-opacity=".5"/>
      <text y="-2" text-anchor="middle" font-size="22" font-weight="900" fill="#0C2733">NC</text>
      <text y="14" text-anchor="middle" font-size="7.5" letter-spacing="2" fill="#5B7885">CORE</text>
      <text y="170" text-anchor="middle" class="micro" fill="#5B7885">08 ACTIVE NODES · ONE LOOP</text>
    </g>

    <!-- ticker -->
    <path d="M0 376H1200" stroke="#B9D2DC"/>
    <g clip-path="url(#tickclip)">
      <g class="mq"><g transform="translate(0 0)"><text x="0" y="29" class="tick" fill="#5B7885">WANMI.ORG ✦ UNUSEDOMAIN.COM ✦ DOG.DO ✦ DP.DO ✦ NEXTWHOIS ✦ DOMAINHUNTER ✦ TIMEAMBER ✦ AIO ✦ </text></g><g transform="translate(903 0)"><text x="0" y="29" class="tick" fill="#5B7885">WANMI.ORG ✦ UNUSEDOMAIN.COM ✦ DOG.DO ✦ DP.DO ✦ NEXTWHOIS ✦ DOMAINHUNTER ✦ TIMEAMBER ✦ AIO ✦ </text></g></g>
      <rect width="1200" height="44" y="376" fill="url(#fade)"/>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="418" fill="none" stroke="#B8C3D1" stroke-opacity=".95"/>
</svg>
