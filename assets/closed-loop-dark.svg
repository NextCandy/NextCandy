<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="NextCandy domain tools constellation map" data-mode="dark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04070D"/><stop offset="1" stop-color="#0A1220"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2FD8FF"/><stop offset=".5" stop-color="#9D8CFF"/><stop offset="1" stop-color="#FF5CA8"/></linearGradient>
    <radialGradient id="aur1" cx=".5" cy=".5" r=".5"><stop stop-color="#2FD8FF" stop-opacity=".10"/><stop offset="1" stop-color="#2FD8FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="aur2" cx=".5" cy=".5" r=".5"><stop stop-color="#FF5CA8" stop-opacity=".09"/><stop offset="1" stop-color="#FF5CA8" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#12202E" stroke-width="1"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="378" rx="20"/></clipPath>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    .title{font-size:15px;font-weight:800;letter-spacing:3px}.micro{font-size:10px;font-weight:700;letter-spacing:2px}.tiny{font-size:9px;letter-spacing:1px}
    .row{font-size:11px;font-weight:700;letter-spacing:1px}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
    .spinr{transform-box:fill-box;transform-origin:center;animation:spin 38s linear infinite reverse}
    .flow{stroke-dasharray:2 8;animation:flow 1.1s linear infinite}
    .boot{animation:boot .6s ease-out both}
    @keyframes pulse{50%{opacity:.3;transform:scale(.65)}}@keyframes spin{to{transform:rotate(360deg)}}
    @keyframes flow{to{stroke-dashoffset:-10}}@keyframes boot{from{opacity:.35}}
    @media(prefers-reduced-motion:reduce){.pulse,.spin,.spinr,.flow,.boot{animation:none}}
  </style>

<g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <ellipse cx="80" cy="0" rx="360" ry="180" fill="url(#aur1)"/>
    <ellipse cx="1160" cy="380" rx="400" ry="200" fill="url(#aur2)"/>
    <rect width="1200" height="380" fill="url(#grid)" opacity=".55"/>
    <path d="M0 1.5H1200" stroke="url(#accent)" stroke-width="3"/>

    <text x="28" y="36" class="title" fill="#2FD8FF">DOMAIN LOOP // CONSTELLATION</text>

<g transform="translate(988 29)"><circle class="pulse" r="5" fill="#3DF2A6" filter="url(#glow)"/><text x="14" y="4" class="micro" fill="#3DF2A6">8 MODULES LINKED</text></g>
    <path d="M28 52H1172" stroke="#1E3446"/>

    <path class="flow" d="M600.0 157.0L600.0 147.0" stroke="#2FD8FF" stroke-width="1.6" fill="none" opacity=".8"/>
    <path class="flow" d="M841.3 136.4L655.8 189.1" stroke="#FF5CA8" stroke-width="1.6" fill="none" opacity=".8"/>
    <path class="flow" d="M970.0 205.0L658.0 205.0" stroke="#3DF2A6" stroke-width="1.6" fill="none" opacity=".8"/>
    <path class="flow" d="M841.3 273.6L655.8 220.9" stroke="#FFC857" stroke-width="1.6" fill="none" opacity=".8"/>
    <path class="flow" d="M600.0 253.0L600.0 263.0" stroke="#9D8CFF" stroke-width="1.6" fill="none" opacity=".8"/>
    <path class="flow" d="M358.7 273.6L544.2 220.9" stroke="#2FD8FF" stroke-width="1.6" fill="none" opacity=".8"/>
    <path class="flow" d="M230.0 205.0L542.0 205.0" stroke="#FF5CA8" stroke-width="1.6" fill="none" opacity=".8"/>
    <path class="flow" d="M358.7 136.4L544.2 189.1" stroke="#3DF2A6" stroke-width="1.6" fill="none" opacity=".8"/>

<g>
      <circle class="spin" cx="600" cy="205" r="52" fill="none" stroke="#2FD8FF" stroke-width="1.4" stroke-dasharray="10 14" opacity=".9"/>
      <circle class="spinr" cx="600" cy="205" r="36" fill="none" stroke="#FF5CA8" stroke-width="1.2" stroke-dasharray="4 9" opacity=".9"/>
      <circle cx="600" cy="205" r="15" fill="#0A1420" stroke="url(#accent)" stroke-width="2"/>
      <circle class="pulse" cx="600" cy="205" r="5.5" fill="#3DF2A6" filter="url(#glow)"/>
      <text x="600" y="281" text-anchor="middle" class="micro" fill="#EAF6FC">NC CORE</text>
    </g>

<g class="boot" style="animation-delay:0.15s" transform="translate(600.0 77.0)">
      <rect x="-78" y="-24" width="156" height="48" rx="24" fill="#0A1420" stroke="#2FD8FF" stroke-opacity=".65"/>
      <circle class="pulse" cx="-56" cy="0" r="4" fill="#2FD8FF" filter="url(#glow)"/>
      <text x="8" y="-3" text-anchor="middle" class="row" fill="#EAF6FC">COLLECT</text>
      <text x="8" y="13" text-anchor="middle" class="tiny" fill="#7E96A6">UnUseDomain</text>
    </g>
<g class="boot" style="animation-delay:0.23s" transform="translate(918.2 114.5)">
      <rect x="-78" y="-24" width="156" height="48" rx="24" fill="#0A1420" stroke="#FF5CA8" stroke-opacity=".65"/>
      <circle class="pulse" cx="-56" cy="0" r="4" fill="#FF5CA8" filter="url(#glow)"/>
      <text x="8" y="-3" text-anchor="middle" class="row" fill="#EAF6FC">MONITOR</text>
      <text x="8" y="13" text-anchor="middle" class="tiny" fill="#7E96A6">DomainHunter</text>
    </g>
<g class="boot" style="animation-delay:0.31s" transform="translate(1050.0 205.0)">
      <rect x="-78" y="-24" width="156" height="48" rx="24" fill="#0A1420" stroke="#3DF2A6" stroke-opacity=".65"/>
      <circle class="pulse" cx="-56" cy="0" r="4" fill="#3DF2A6" filter="url(#glow)"/>
      <text x="8" y="-3" text-anchor="middle" class="row" fill="#EAF6FC">LOOKUP</text>
      <text x="8" y="13" text-anchor="middle" class="tiny" fill="#7E96A6">nextwhois</text>
    </g>
<g class="boot" style="animation-delay:0.39s" transform="translate(918.2 295.5)">
      <rect x="-78" y="-24" width="156" height="48" rx="24" fill="#0A1420" stroke="#FFC857" stroke-opacity=".65"/>
      <circle class="pulse" cx="-56" cy="0" r="4" fill="#FFC857" filter="url(#glow)"/>
      <text x="8" y="-3" text-anchor="middle" class="row" fill="#EAF6FC">ARCHIVE</text>
      <text x="8" y="13" text-anchor="middle" class="tiny" fill="#7E96A6">TimeAmber</text>
    </g>
<g class="boot" style="animation-delay:0.47s" transform="translate(600.0 333.0)">
      <rect x="-78" y="-24" width="156" height="48" rx="24" fill="#0A1420" stroke="#9D8CFF" stroke-opacity=".65"/>
      <circle class="pulse" cx="-56" cy="0" r="4" fill="#9D8CFF" filter="url(#glow)"/>
      <text x="8" y="-3" text-anchor="middle" class="row" fill="#EAF6FC">BOARD</text>
      <text x="8" y="13" text-anchor="middle" class="tiny" fill="#7E96A6">aio</text>
    </g>
<g class="boot" style="animation-delay:0.55s" transform="translate(281.8 295.5)">
      <rect x="-78" y="-24" width="156" height="48" rx="24" fill="#0A1420" stroke="#2FD8FF" stroke-opacity=".65"/>
      <circle class="pulse" cx="-56" cy="0" r="4" fill="#2FD8FF" filter="url(#glow)"/>
      <text x="8" y="-3" text-anchor="middle" class="row" fill="#EAF6FC">PUBLISH</text>
      <text x="8" y="13" text-anchor="middle" class="tiny" fill="#7E96A6">dog.do</text>
    </g>
<g class="boot" style="animation-delay:0.63s" transform="translate(150.0 205.0)">
      <rect x="-78" y="-24" width="156" height="48" rx="24" fill="#0A1420" stroke="#FF5CA8" stroke-opacity=".65"/>
      <circle class="pulse" cx="-56" cy="0" r="4" fill="#FF5CA8" filter="url(#glow)"/>
      <text x="8" y="-3" text-anchor="middle" class="row" fill="#EAF6FC">HOME</text>
      <text x="8" y="13" text-anchor="middle" class="tiny" fill="#7E96A6">HomePage</text>
    </g>
<g class="boot" style="animation-delay:0.71s" transform="translate(281.8 114.5)">
      <rect x="-78" y="-24" width="156" height="48" rx="24" fill="#0A1420" stroke="#3DF2A6" stroke-opacity=".65"/>
      <circle class="pulse" cx="-56" cy="0" r="4" fill="#3DF2A6" filter="url(#glow)"/>
      <text x="8" y="-3" text-anchor="middle" class="row" fill="#EAF6FC">HUNT</text>
      <text x="8" y="13" text-anchor="middle" class="tiny" fill="#7E96A6">dshunter</text>
    </g>

    <path d="M28 352H1172" stroke="#1E3446"/><text x="28" y="369" class="tiny" fill="#7E96A6">DOMAINS · WHOIS · SELF-HOSTED — EVERY MODULE REPORTS TO CORE</text><text x="1172" y="369" text-anchor="end" class="tiny" fill="#7E96A6">LOOP STATUS: STABLE</text>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="20" fill="none" stroke="url(#accent)" stroke-opacity=".8"/>
</svg>
